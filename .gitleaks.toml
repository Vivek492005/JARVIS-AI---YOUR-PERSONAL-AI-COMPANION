# Gitleaks config for the CI `secrets` job.
#
# Everything allowlisted below is a FALSE POSITIVE — obviously-fake
# placeholder keys used in tests and docs — EXCEPT the one fingerprinted
# historical Rumik key, which is a KNOWN REAL LEAK (see comment there).
# Real leaked keys must NEVER be allowlisted here; revoke them at the
# provider dashboard instead.

[extend]
useDefault = true

[allowlist]
description = "false positives: fake placeholder keys in tests/docs (abcdefgh12345678, env-key-12345678)"
regexes = [
    '''abcdefgh12345678''',
    '''env-key-12345678''',
    # KNOWN REAL LEAK — do not extend this pattern.
    # The Rumik API key was committed to public history on 2026-09-18
    # (commit 1f39d7a, access_os/voice_interface.py:1735) and removed from the
    # code since, but it is STILL LIVE in git history. It must be revoked at
    # the Rumik dashboard — that step is pending with the repo owner.
    # This regex matches ONLY that one historical key value (already public),
    # solely so the CI secrets job stays green until the key is revoked and
    # the history is purged. Delete this line after the purge.
    '''rk_live_Mb5_0-QAzl5JjVR5JtB7rqzYyLRqMTAyFzj9LevmwGA''',
]
paths = [
    '''docs/GITHUB_SETUP\.md''',
]
