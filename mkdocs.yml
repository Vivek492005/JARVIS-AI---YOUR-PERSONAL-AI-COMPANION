site_name: JARVIS — docs
site_description: Documentation for JARVIS, the voice+text AI companion for Windows.
site_author: Vivek Bartwal
repo_url: https://github.com/Vivek492005/JARVIS-AI---YOUR-PERSONAL-AI-COMPANION

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Security model: THREAT_MODEL.md
  - Skills guide: skills-guide.md
  - Voice setup: AUDIO_SETUP.md
  - Wake-word testing: WAKEWORD_TEST.md
  - Integrations: INTEGRATIONS_SETUP.md
  - Packaging: PACKAGING.md
  - Performance: PERF_BUDGET.md
  - Hardware checklist: HARDWARE_CHECKLIST.md
  - Benchmarks: BENCHMARKS.md
  - Comparison: COMPARISON.md
  - Case study: CASE_STUDY.md
  - FAQ: faq.md
  - Audit (2026-11): AUDIT_2026-11.md
