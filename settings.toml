# JARVIS settings — generated/migrated automatically.
# Secrets live in .env, never in this file.

[voice]
language = "en-IN"
wake_word = "jarvis"
require_wake_word = false
max_utterance_s = 6.0
tts_chain = ["rumik", "edge", "pyttsx3"]
tts_engine = "neural"
rumik_model = "muga"
neural_voice = "en-US-AvaNeural"
voice_rate = 160
voice_volume = 1.0
energy_threshold = 300
pause_threshold = 0.8

[brain]
ai_provider = "huggingface"
provider_chain = ["huggingface", "deepseek", "local"]
hf_model = "Qwen/Qwen2.5-72B-Instruct"
deepseek_model = "deepseek-chat"
temperature = 0.3
enable_ai_agent = true
fallback_to_local = true

[safety]
autonomy_level = 1
confirm_timeout_s = 10.0
max_tool_calls_per_minute = 20
max_steps_per_task = 12

[privacy]
privacy_mode = false
