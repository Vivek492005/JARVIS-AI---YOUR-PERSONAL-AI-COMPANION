# ============================================================
# JARVIS settings template — copy to `settings.toml` and edit.
# (A legacy voice_config.json is migrated automatically on first run.)
# Secrets do NOT go here — put API keys in `.env` (see env.example).
# Every value can also be set via env: VOICE__WAKE_WORD=friday
# ============================================================

[voice]
language = "en-IN"
wake_word = "jarvis"
require_wake_word = true      # F-07: mic ignores ambient audio without the wake word
max_utterance_s = 30.0        # F-18: was a hardcoded 6.0s cutoff
tts_chain = ["rumik", "edge", "pyttsx3"]
tts_engine = "rumik"
rumik_model = "muga"
neural_voice = "en-IN-NeerjaNeural"
voice_rate = 160
voice_volume = 1.0
energy_threshold = 300
pause_threshold = 0.8
# Task 1.6.2: push-to-talk (hold-to-talk). Off by default; when on, the mic
# only captures while the hotkey is held.
push_to_talk = false
push_to_talk_hotkey = "ctrl+alt+j"
# Task 1.6.3: Privacy Mode — mic off entirely. No capture, no wake-word scan.
privacy_mode = false

[brain]
ai_provider = "huggingface"
provider_chain = ["huggingface", "deepseek", "local"]
hf_model = "Qwen/Qwen2.5-72B-Instruct"
deepseek_model = "deepseek-chat"
temperature = 0.3
enable_ai_agent = true
fallback_to_local = true

[safety]
autonomy_level = 1            # 0=ask everything … 3=auto incl. destructive (SYSTEM always confirms)
confirm_timeout_s = 10.0      # unanswered confirmation -> DENY
max_tool_calls_per_minute = 20  # Task 1.8: over budget -> rate_limited, tool calls DENY
max_steps_per_task = 12
# Task 1.8: kill switch hotkey (Ctrl+Alt+Shift+J) — stops everything now.
# Bound best-effort on Windows via the `keyboard` package.

[privacy]
privacy_mode = false          # true = local-only chain, no cloud calls at all
# Task 1.10: per-provider egress toggles (privacy_mode forces all off).
allow_huggingface = true      # chat text -> Hugging Face router (Qwen)
allow_deepseek = true         # chat text -> DeepSeek
allow_rumik_tts = true        # TTS text -> Rumik API
allow_google_stt = true       # mic audio -> Google Speech Recognition
