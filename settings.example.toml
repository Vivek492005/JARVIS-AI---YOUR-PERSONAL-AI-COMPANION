# ============================================================
# JARVIS settings template — copy to `settings.toml` and edit.
# (A legacy voice_config.json is migrated automatically on first run.)
# Secrets do NOT go here — put API keys in `.env` (see env.example).
# Every value can also be set via env: VOICE__WAKE_WORD=friday
# ============================================================

[voice]
language = "en-IN"
wake_word = "jarvis"
require_wake_word = true      # F-07: mic ignores ambient audio without the wake word
max_utterance_s = 30.0        # F-18: was a hardcoded 6.0s cutoff
tts_chain = ["rumik", "edge", "pyttsx3"]
tts_engine = "rumik"
rumik_model = "muga"
neural_voice = "en-IN-NeerjaNeural"
voice_rate = 160
voice_volume = 1.0
energy_threshold = 300
pause_threshold = 0.8

[brain]
ai_provider = "huggingface"
provider_chain = ["huggingface", "deepseek", "local"]
hf_model = "Qwen/Qwen2.5-72B-Instruct"
deepseek_model = "deepseek-chat"
temperature = 0.3
enable_ai_agent = true
fallback_to_local = true

[safety]
autonomy_level = 1            # 0=ask everything … 3=auto incl. destructive (SYSTEM always confirms)
confirm_timeout_s = 10.0      # unanswered confirmation -> DENY
max_tool_calls_per_minute = 20
max_steps_per_task = 12

[privacy]
privacy_mode = false          # true = local-only chain, no cloud calls at all
