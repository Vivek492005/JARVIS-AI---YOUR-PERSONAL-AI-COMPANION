name: Bug report
description: Report something JARVIS did wrong or insecurely
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: JARVIS version / commit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce. NEVER paste API keys or secrets here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [voice, tool-execution, policy-gate, packaging, docs, other]
