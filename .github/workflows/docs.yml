# Validate the MkDocs documentation site (Task 8.6).
#
# Builds with --strict on every push to main. Publishing is a MANUAL step
# for now: the repo's GitHub Pages currently serves the landing page from
# main /(root); flipping Pages to the docs site would replace it, so that
# decision stays with the maintainer. See docs/PACKAGING.md note.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
