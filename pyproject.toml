# JARVIS-AI packaging (Master Plan Task 0.4).
# Install:  pip install -e .            (runtime)
#           pip install -e ".[dev]"     (runtime + tests/lint)
#           pip install -e ".[vision]"  (camera/gesture stack)

[project]
name = "jarvis-assistant"
version = "0.2.0"
description = "JARVIS — a Windows voice+text AI companion with a policy-gated tool layer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Vivek Bartwal" }]

dependencies = [
    # Single typed config (Task 0.3)
    "pydantic>=2",
    "pydantic-settings>=2",
    # LLM providers (OpenAI-compatible: Qwen 2.5 72B primary, DeepSeek fallback)
    "openai>=1.0.0",
    "httpx>=0.27.0",
    # Speech: Google STT via SpeechRecognition; TTS chain Rumik -> edge-tts -> pyttsx3
    "SpeechRecognition>=3.10.0",
    "edge-tts>=7.0.0",
    "pyttsx3>=2.90",
    # Command pipeline: fuzzy matching (stage 2 of VoiceCommandProcessor)
    "fuzzywuzzy>=0.18.0",
    # OS control & system info
    "pyautogui>=0.9.54",
    "psutil>=5.9.0",
    "pyperclip>=1.8.0",
    # Misc runtime
    "python-dotenv>=1.0.0",
    "Pillow>=9.5.0",
    "yt-dlp>=2026.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.7.0", "mediapipe>=0.10.0"]
voice-local = ["faster-whisper", "openwakeword", "silero-vad"]
audio = ["sounddevice>=0.4.6", "webrtcvad>=2.0.10"]
wakeword = ["openwakeword>=0.6.0"]
# Task 3.6 extra: local neural voice cloning (Coqui XTTS v2). Heavy
# (~2 GB model); lazy-imported so the base install stays light.
xtts = ["TTS>=0.22.0"]
browser = ["playwright"]
server = ["fastapi", "uvicorn[standard]"]
# Task 1.9: OS keyring for secrets (Windows Credential Manager etc.).
# Optional — without it, .env remains the secrets home.
keyring = ["keyring>=25.0.0"]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff",
]

[project.scripts]
# Phase 2: the real `jarvis` CLI (serve/ui/doctor/reflex). The desktop entry
# point stays main.py; jarvis-legacy is the old ACCESS-OS demo app.
jarvis = "jarvis.cli:main"
jarvis-legacy = "jarvis.legacy.access_os_main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jarvis*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "hardware: needs camera/microphone hardware (skipped in CI)",
    "live: needs network access to real APIs (skipped in CI)",
    "slow: long-running tests",
    "security: security test-suite (tests/security/)",
    "perf: performance-budget tests (timing-sensitive)",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["jarvis"]
omit = [
    "*/tests/*",
    "*/legacy/*",          # frozen legacy code, not part of the v1.0 surface
    "*/jarvis/hud/static/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "S", "B"]
# S = bandit security rules: bans shell=True / os.system / eval / exec (Task 1.4.4)
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
